<header class="site-header">
  <div class="wrapper topbar">

    {%- comment -%}
    {%- endcomment -%}
    {% if page.url != "/" and site.name %}
      <span class="site-title">
        {% assign name = site.name | split: ' ' %}
        <strong>{{ name | first }}</strong> {{ name | last }}
      </span>
    {% endif %}

    <nav class="site-nav primary">
      <div class="links">
        <a class="page-link {% if page.url == '/' %}active{% endif %}"
           href="{{ site.baseurl }}/">Home</a>

        <a class="page-link {% if page.url contains '/projects' or page.url contains '/lab' %}active{% endif %}"
           href="{{ site.baseurl }}/projects/">Lab</a>

        <a class="page-link {% if page.url contains '/research' %}active{% endif %}"
           href="{{ site.baseurl }}/research/">Research</a>
      </div>

      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" class="nav-toggle" aria-label="Toggle navigation">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
            <path fill="#424242" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484 C0,0.665,0.665,0,1.484,0h15.031C17.335,0,18,0.665,18,1.484z"/>
            <path fill="#424242" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,6.031,18,6.696,18,7.516z"/>
            <path fill="#424242" d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        <a class="page-link" href="{{ site.baseurl }}/">Home</a>
        <a class="page-link" href="{{ site.baseurl }}/projects/">Lab</a>
        <a class="page-link" href="{{ site.baseurl }}/research/">Research</a>
      </div>
    </nav>
  </div>
</header>
